<!DOCTYPE html>
<html lang="ko" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF 붙이기</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- pdf-lib for PDF manipulation -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- PDF.js for rendering PDF thumbnail preview -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .file-item-card {
      transition: all 0.15s ease-in-out;
    }
    .file-item-card.dragging {
      opacity: 0.4;
      border-style: dashed;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-700">

  <!-- Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <div class="flex items-center space-x-3 text-left">
        <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow">
          <i class="fa-solid fa-file-circle-plus text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-base sm:text-lg leading-tight tracking-tight text-slate-100">
            PDF 붙이기
          </h1>
          <p class="text-[11px] text-slate-400">여러 PDF 파일의 순서를 조정하여 하나의 PDF 문서로 병합</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-3">
        <!-- 숭문AI코디 버튼 (링크 비활성화, 스파클 아이콘) -->
        <a href="#" onclick="return false;" class="px-3.5 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition-all flex items-center space-x-1.5 shadow-sm border border-indigo-400/30 cursor-pointer">
          <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
          <span>숭문AI코디</span>
        </a>

        <button id="reset-btn" class="hidden px-3.5 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 hover:text-white rounded-lg border border-slate-700 transition-all flex items-center space-x-1.5">
          <i class="fa-solid fa-arrow-rotate-left text-xs"></i>
          <span>다시 처음으로</span>
        </button>
      </div>

    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col">

    <!-- Initial Upload Zone -->
    <label for="pdf-file-input" id="upload-zone" class="flex-1 min-h-[380px] flex flex-col items-center justify-center border-2 border-dashed border-slate-300 hover:border-brand-500 rounded-2xl p-8 text-center bg-white hover:bg-slate-50/50 transition-all cursor-pointer group shadow-sm block">
      <input type="file" id="pdf-file-input" accept="application/pdf" multiple class="sr-only">
      
      <div class="w-16 h-16 rounded-full bg-brand-50 group-hover:bg-brand-100 flex items-center justify-center text-brand-600 mb-4 transition-transform group-hover:scale-105 mx-auto">
        <i class="fa-solid fa-file-arrow-up text-2xl"></i>
      </div>
      
      <h3 class="text-lg font-bold text-slate-800 mb-1">합칠 PDF 파일들을 선택하거나 드래그하세요</h3>
      <p class="text-xs text-slate-500 max-w-md mb-6 mx-auto">
        여러 파일을 한 번에 선택할 수 있으며, 서버로 전송되지 않고 브라우저 내부에서 안전하게 병합됩니다.
      </p>

      <div class="inline-flex items-center px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs sm:text-sm rounded-xl shadow transition-all space-x-2">
        <i class="fa-solid fa-folder-open"></i>
        <span>컴퓨터에서 파일 선택 (다중 선택 가능)</span>
      </div>
    </label>

    <!-- Workspace -->
    <div id="workspace" class="hidden flex-1 flex flex-col space-y-6">
      
      <!-- Control Toolbar -->
      <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        
        <div class="flex items-center space-x-3">
          <div class="p-2.5 bg-brand-50 text-brand-600 rounded-lg border border-brand-100">
            <i class="fa-solid fa-files text-xl"></i>
          </div>
          <div>
            <h3 class="font-bold text-sm text-slate-900">PDF 병합 목록</h3>
            <p id="total-summary" class="text-xs text-slate-500">총 0개 파일 • 0페이지</p>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-3">
          <!-- Add More Files Button -->
          <label for="pdf-add-more-input" class="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs rounded-xl transition-all flex items-center space-x-1.5 cursor-pointer">
            <i class="fa-solid fa-plus text-xs"></i>
            <span>파일 추가</span>
            <input type="file" id="pdf-add-more-input" accept="application/pdf" multiple class="sr-only">
          </label>

          <button id="btn-clear-all" class="px-3.5 py-2 bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-600 font-medium text-xs rounded-xl transition-all flex items-center space-x-1.5">
            <i class="fa-solid fa-trash-can text-xs"></i>
            <span>전체 삭제</span>
          </button>

          <button id="btn-merge" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs rounded-xl shadow transition-all flex items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="fa-solid fa-object-group"></i>
            <span>하나로 합치기 및 저장</span>
          </button>
        </div>
      </div>

      <!-- Loading Spinner -->
      <div id="loading-spinner" class="hidden py-10 flex flex-col items-center justify-center space-y-3">
        <div class="w-8 h-8 border-3 border-brand-200 border-t-brand-600 rounded-full animate-spin"></div>
        <p class="text-xs font-medium text-slate-600">PDF 파일을 분석하고 미리보기를 불러오는 중입니다...</p>
      </div>

      <!-- File List Area -->
      <div id="file-list-container" class="space-y-3 max-h-[calc(100vh-280px)] overflow-y-auto pr-1">
        <!-- Rendered dynamically -->
      </div>

    </div>

  </main>

  <!-- Toast Notification -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    // Application State
    let fileItems = []; // Array of { id, file, name, sizeMB, totalPages, bytes }

    // DOM Elements
    const uploadZone = document.getElementById('upload-zone');
    const pdfFileInput = document.getElementById('pdf-file-input');
    const pdfAddMoreInput = document.getElementById('pdf-add-more-input');
    const workspace = document.getElementById('workspace');
    const resetBtn = document.getElementById('reset-btn');

    const totalSummaryEl = document.getElementById('total-summary');
    const loadingSpinner = document.getElementById('loading-spinner');
    const fileListContainer = document.getElementById('file-list-container');
    
    const btnClearAll = document.getElementById('btn-clear-all');
    const btnMerge = document.getElementById('btn-merge');

    // Toast generator
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-xs font-semibold text-white transition-all transform translate-y-2 opacity-0 flex items-center space-x-2 ${
        type === 'error' ? 'bg-red-600' : type === 'success' ? 'bg-emerald-600' : 'bg-slate-800'
      }`;
      toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-triangle-exclamation' : type === 'success' ? 'fa-circle-check' : 'fa-circle-info'} text-sm"></i> <span>${message}</span>`;
      
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 200);
      }, 3000);
    }

    // Drag & Drop
    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('border-brand-500', 'bg-brand-50/30');
    });

    uploadZone.addEventListener('dragleave', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('border-brand-500', 'bg-brand-50/30');
    });

    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('border-brand-500', 'bg-brand-50/30');
      if (e.dataTransfer.files.length > 0) {
        handleFilesSelected(Array.from(e.dataTransfer.files));
      }
    });

    pdfFileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFilesSelected(Array.from(e.target.files));
      }
    });

    pdfAddMoreInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFilesSelected(Array.from(e.target.files));
      }
    });

    resetBtn.addEventListener('click', resetApp);
    btnClearAll.addEventListener('click', resetApp);

    function resetApp() {
      fileItems = [];
      pdfFileInput.value = '';
      pdfAddMoreInput.value = '';
      fileListContainer.innerHTML = '';
      
      workspace.classList.add('hidden');
      resetBtn.classList.add('hidden');
      uploadZone.classList.remove('hidden');
      updateSummary();
    }

    // Process selected files
    async function handleFilesSelected(files) {
      const pdfFiles = files.filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));

      if (pdfFiles.length === 0) {
        showToast('PDF 파일만 추가가 가능합니다.', 'error');
        return;
      }

      uploadZone.classList.add('hidden');
      workspace.classList.remove('hidden');
      resetBtn.classList.remove('hidden');
      loadingSpinner.classList.remove('hidden');

      for (const file of pdfFiles) {
        try {
          const bytes = await file.arrayBuffer();
          let pageCount = 0;

          // Read page count using pdf-lib
          try {
            const pdfDoc = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
            pageCount = pdfDoc.getPageCount();
          } catch (err) {
            console.warn('pdf-lib failed to load page count, falling back to pdf.js', err);
            if (typeof pdfjsLib !== 'undefined') {
              const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(bytes.slice(0)) });
              const pdf = await loadingTask.promise;
              pageCount = pdf.numPages;
            }
          }

          const item = {
            id: 'file-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
            file: file,
            name: file.name,
            sizeMB: (file.size / (1024 * 1024)).toFixed(2),
            totalPages: pageCount,
            bytes: bytes
          };

          fileItems.push(item);
        } catch (err) {
          console.error(err);
          showToast(`${file.name} 파일을 읽는 중 오류가 발생했습니다.`, 'error');
        }
      }

      loadingSpinner.classList.add('hidden');
      renderFileList();
      updateSummary();
      showToast(`${pdfFiles.length}개의 파일이 추가되었습니다.`, 'success');
    }

    // Render list of files with order controls
    function renderFileList() {
      fileListContainer.innerHTML = '';

      if (fileItems.length === 0) {
        resetApp();
        return;
      }

      fileItems.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'file-item-card bg-white rounded-xl border border-slate-200 p-4 flex items-center justify-between shadow-sm hover:border-brand-300 gap-3';
        card.dataset.id = item.id;

        card.innerHTML = `
          <div class="flex items-center space-x-3 min-w-0 flex-1">
            <div class="flex flex-col space-y-1 text-slate-400">
              <button class="btn-move-up p-1 hover:text-brand-600 transition-colors disabled:opacity-30" ${index === 0 ? 'disabled' : ''} title="위로 이동">
                <i class="fa-solid fa-chevron-up text-xs"></i>
              </button>
              <button class="btn-move-down p-1 hover:text-brand-600 transition-colors disabled:opacity-30" ${index === fileItems.length - 1 ? 'disabled' : ''} title="아래로 이동">
                <i class="fa-solid fa-chevron-down text-xs"></i>
              </button>
            </div>

            <div class="w-7 h-7 rounded-lg bg-slate-100 text-slate-700 font-bold text-xs flex items-center justify-center flex-shrink-0">
              ${index + 1}
            </div>

            <div class="p-2 bg-red-50 text-red-600 rounded-lg flex-shrink-0">
              <i class="fa-regular fa-file-pdf text-lg"></i>
            </div>

            <div class="min-w-0 flex-1">
              <h4 class="font-bold text-sm text-slate-800 truncate">${item.name}</h4>
              <p class="text-xs text-slate-400">${item.totalPages}페이지 • ${item.sizeMB} MB</p>
            </div>
          </div>

          <div class="flex items-center space-x-2 flex-shrink-0">
            <button class="btn-delete p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors" title="삭제">
              <i class="fa-solid fa-xmark text-sm"></i>
            </button>
          </div>
        `;

        // Move Up
        card.querySelector('.btn-move-up').addEventListener('click', () => {
          if (index > 0) {
            const temp = fileItems[index];
            fileItems[index] = fileItems[index - 1];
            fileItems[index - 1] = temp;
            renderFileList();
            updateSummary();
          }
        });

        // Move Down
        card.querySelector('.btn-move-down').addEventListener('click', () => {
          if (index < fileItems.length - 1) {
            const temp = fileItems[index];
            fileItems[index] = fileItems[index + 1];
            fileItems[index + 1] = temp;
            renderFileList();
            updateSummary();
          }
        });

        // Delete
        card.querySelector('.btn-delete').addEventListener('click', () => {
          fileItems.splice(index, 1);
          renderFileList();
          updateSummary();
        });

        fileListContainer.appendChild(card);
      });
    }

    function updateSummary() {
      const totalFiles = fileItems.length;
      const totalPages = fileItems.reduce((acc, curr) => acc + curr.totalPages, 0);
      totalSummaryEl.textContent = `총 ${totalFiles}개 파일 • ${totalPages}페이지`;
      btnMerge.disabled = totalFiles === 0;
    }

    // Merge PDF files using pdf-lib
    btnMerge.addEventListener('click', async () => {
      if (fileItems.length === 0) {
        showToast('병합할 PDF 파일을 먼저 등록해 주세요.', 'error');
        return;
      }

      const originalBtnText = btnMerge.innerHTML;
      btnMerge.disabled = true;
      btnMerge.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>병합 중...</span>`;

      try {
        const mergedPdf = await PDFLib.PDFDocument.create();

        for (const item of fileItems) {
          const srcPdf = await PDFLib.PDFDocument.load(item.bytes, { ignoreEncryption: true });
          const pageIndices = srcPdf.getPageIndices();
          const copiedPages = await mergedPdf.copyPages(srcPdf, pageIndices);
          copiedPages.forEach(page => mergedPdf.addPage(page));
        }

        const mergedPdfBytes = await mergedPdf.save();

        // Download trigger
        const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);

        const firstBaseName = fileItems[0].name.replace(/\.pdf$/i, '');
        link.download = `${firstBaseName}_병합.pdf`;
        link.click();

        URL.revokeObjectURL(link.href);
        showToast('PDF 파일 병합이 완료되어 다운로드되었습니다.', 'success');
      } catch (err) {
        console.error('Merge error:', err);
        showToast('PDF 파일 병합 도중 오류가 발생했습니다.', 'error');
      } finally {
        btnMerge.disabled = false;
        btnMerge.innerHTML = originalBtnText;
      }
    });
  </script>
</body>
</html>
